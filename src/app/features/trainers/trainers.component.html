<section class="listing-header">
  <div class="container">
    <p class="eyebrow">MEET THE MENTORS</p>
    <h1>Learn from people who <em>teach by doing.</em></h1>
    <p>Our trainers bring both technical depth and practical experience.</p>
  </div>
</section>

<section class="section">
  <div class="container trainer-grid">
    @for (trainer of trainers; track trainer.name) {
      <article class="trainer-card">
        <div class="trainer-badge">{{trainer.name.charAt(0)}}</div>
        <h3>{{trainer.name}}</h3>
        <p class="role">{{trainer.role}}</p>
        <p>{{trainer.specialty}}</p>
      </article>
    }
  </div>
</section>
